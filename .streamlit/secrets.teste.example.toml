# ============================================================
# AMBIENTE DE TESTE — dados MASCARADOS no Supabase; a equipe testa tudo como ADMINISTRADOR
# Copie para .streamlit/secrets.toml e preencha. NUNCA versione o arquivo preenchido.
# No Streamlit Community Cloud, cole este conteúdo em: Advanced settings > Secrets.
# ============================================================

[data]
backend = "postgres"
# Copie o "Session pooler" em Connect (painel do Supabase). Troque o início por postgresql+psycopg2:// e termine com ?sslmode=require
# Se a senha tiver @ : / # ? %, codifique (@ = %40, / = %2F, # = %23).
postgres_url = "postgresql+psycopg2://postgres.SEU-REF:SUA-SENHA@aws-1-REGIAO.pooler.supabase.com:5432/postgres?sslmode=require"

[access]
team_password = "TROQUE (openssl rand -base64 18)"
team_level = "admin"        # só funciona com carga MASCARADA; com dados reais o app recusa e usa o login Google

[privacy]
k_min = 1                   # sem omissão de valores pequenos (painéis em geral)
k_sensivel = 1              # idem para Saúde e Doações e cestas
k_explorador = 1            # idem para tabelas baixadas no nível público
k_download = 5              # k-anonimato dos arquivos de pesquisador (1 = desligado)
pseudo_secret = "TROQUE (openssl rand -hex 24)"

[dev]
enabled = false             # NUNCA ligue fora do seu computador
